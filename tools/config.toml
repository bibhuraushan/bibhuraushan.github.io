# Settings for the scripts in this folder. Paths are relative to the site root.

[publications]
# NASA ADS search that finds your papers. Swap in `orcid:XXXX-XXXX-XXXX-XXXX`
# once your ORCID is linked in ADS; it avoids namesakes.
query = 'author:("Jha, Bibhuti Kumar" OR "Jha, Bibhuti K." OR "Jha, B. K.") year:2017-2100'
# Papers the query misses, and records it wrongly picks up (ADS bibcodes).
extra_bibcodes = []
exclude_bibcodes = []
# Name variants used to mark first-author papers and highlight you in author lists.
my_names = ["Jha, Bibhuti Kumar", "Jha, Bibhuti K.", "Jha, B. K.", "Jha, B."]
output = "data/publications.json"

[gallery]
photos_dir = "photos"
captions = "photos/captions.toml"
output = "data/gallery.json"
thumb_width = 720
large_width = 2400
# Folder name -> album shown on the Photography page.
albums = { "solar-sky" = "Solar and Sky", "eclipses" = "Eclipses", "landscapes-travel" = "Landscapes and Travel" }

[aft_polar]
# AFT baseline polar fields (SwRI), used for the Cycle 25 polar field plot on Home.
url = "https://data.boulder.swri.edu/lisa/AFT_Baseline/aft_parameters/AFT_polar_data.csv"
start = "2019-12-01"   # Cycle 25 minimum
units = "G"
output = "data/aft-polar.json"
